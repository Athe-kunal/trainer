[project]
name = "trainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "configmate[standard]>=0.1.8",
    "datasets>=4.4.1",
    "debugpy-run>=1.16",
    "gem>=0.1.12",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "liger-kernel>=0.6.4",
    "loguru>=0.7.3",
    "nvidia-ml-py>=13.580.82",
    "nvitop>=1.6.1",
    "omegaconf>=2.3.0",
    "orjson>=3.11.5",
    "packaging>=25.0",
    "pyvene>=0.1.8",
    "ray>=2.53.0",
    "ring-flash-attn==0.1.8",
    "torch-memory-saver>=0.0.9",
    "transformers>=4.57.5",
    "uvloop>=0.22.1",
    "vllm>=0.10.0",
    "wandb>=0.24.2",
    "wheel>=0.46.3",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
