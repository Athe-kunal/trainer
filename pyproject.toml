[project]
name = "trainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12.0",
    "configmate[standard]>=0.1.8",
    "datasets>=4.4.1",
    "debugpy-run>=1.16",
    "gem>=0.1.12",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "liger-kernel>=0.6.4",
    "loguru>=0.7.3",
    "nvidia-ml-py>=13.580.82",
    "nvitop>=1.6.1",
    "omegaconf>=2.3.0",
    "orjson>=3.11.5",
    "packaging>=25.0",
    "pyvene>=0.1.8",
    "torch>=2.10,<2.11",
    "ray>=2.53.0",
    "ring-flash-attn==0.1.8",
    "torch-memory-saver>=0.0.9",
    "transformers>=4.57.5",
    "uvloop>=0.22.1",
    "vllm>=0.19.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wandb>=0.24.2",
    "wheel>=0.46.3",
    "torchdata>=0.11.0",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.1/flash_attn-2.8.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version >= '3.12' and python_full_version < '3.13'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true