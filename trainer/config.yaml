# =============================================================================
# Trainer Configuration
# =============================================================================
# This configuration file contains all parameters for training RL/SFT/DPO models

trainer:
  # Checkpoint settings
  load_ckpt_from: null  # Path to checkpoint to resume from, or "latest" for auto-detection
  save_dir: "./checkpoints"  # Directory to save checkpoints
  save_freq: null  # Save checkpoint every N steps (null to disable periodic saving)
  
  # Training settings
  total_steps: 1000  # Total number of training steps (for PPO/RL)
  n_epochs: 3  # Number of epochs (for SFT/DPO/ORPO/SimPO)
  eval_only: false  # If true, only run evaluation
  test_freq: null  # Run evaluation every N steps (null to disable)
  
  # Logging
  use_wandb: true
  project: "trainer"
  experiment_name: "experiment"

# =============================================================================
# Actor Configuration
# =============================================================================
actor:
  # Model settings
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  use_liger_kernel: false  # Use Liger kernel for efficiency (incompatible with TP)
  dtype: "bfloat16"  # Model dtype: bfloat16, float16, float32
  
  # Parallelism settings
  tp_size: 1  # Tensor parallelism size
  ddp_size: 1  # Data distributed parallelism size
  cp_size: 1  # Context parallelism size
  
  # Memory optimization
  enable_gradient_checkpointing: true
  offload_model: false  # Offload model to CPU when not in use
  offload_optimizer: false  # Offload optimizer states to CPU
  
  # Sequence length settings
  max_length_per_device: 4096  # Max sequence length per device during training
  max_inference_length_per_device: 8192  # Max sequence length per device during inference
  
  # Training settings
  update_per_rollout: 1  # Number of gradient updates per rollout
  max_grad_norm: 1.0  # Gradient clipping threshold
  avg_level: "token"  # Averaging level: "token" or "sequence"
  temperature: 1.0  # Temperature for logit scaling
  freeze_steps: 0  # Number of steps to freeze actor at the beginning
  
  # PPO specific
  clip: 0.2  # PPO clipping ratio
  tis_coef: 0.0  # Truncated importance sampling coefficient (0 to disable)
  
  # Entropy settings
  entropy:
    coef: 0.0  # Entropy coefficient for exploration
  
  # KL divergence settings
  kl:
    coef: 0.0  # KL coefficient (0 to disable KL penalty)
    type: "reward"  # KL type: "reward", "advantage", or "loss"
    reward_estimator: "k1"  # KL estimator for reward: "k1", "k2", "k3"
    loss_estimator: "k1"  # KL estimator for loss: "k1", "k2", "k3"
  
  # DPO/SimPO specific
  beta: 0.1  # Beta parameter for DPO/SimPO
  gamma: 0.5  # Gamma parameter for SimPO margin
  
  # ORPO specific
  lambda_orpo: 0.1  # Lambda parameter for ORPO
  eps: 1e-6  # Epsilon for numerical stability in ORPO
  
  # Optimizer settings
  optimizer:
    lr: 1.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8
  
  # Scheduler settings
  scheduler:
    name: "cosine"  # Scheduler type: cosine, linear, constant, etc.
    warmup_ratio: 0.1  # Warmup ratio of total steps

# =============================================================================
# Reference Actor Configuration (for KL penalty)
# =============================================================================
ref_actor:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  use_liger_kernel: false
  dtype: "bfloat16"
  tp_size: 1
  ddp_size: 1
  cp_size: 1
  enable_gradient_checkpointing: false
  offload_model: true
  offload_optimizer: false
  max_length_per_device: 4096
  max_inference_length_per_device: 8192

# =============================================================================
# Critic Configuration (for GAE advantage estimation)
# =============================================================================
critic:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "bfloat16"
  tp_size: 1
  ddp_size: 1
  cp_size: 1
  enable_gradient_checkpointing: true
  offload_model: false
  offload_optimizer: false
  max_length_per_device: 4096
  max_inference_length_per_device: 8192
  update_per_rollout: 1
  max_grad_norm: 1.0
  avg_level: "token"
  clip: 0.2
  
  optimizer:
    lr: 1.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8
  
  scheduler:
    name: "cosine"
    warmup_ratio: 0.1

# =============================================================================
# Advantage Estimation Configuration
# =============================================================================
adv:
  estimator: "reinforce"  # Advantage estimator: "gae" or "reinforce"
  
  # GAE specific settings
  gamma: 0.99  # Discount factor
  lamda: 0.95  # GAE lambda
  
  # REINFORCE specific settings
  responses_per_prompt: 4  # Number of responses per prompt for baseline
  global_norm: false  # Use global normalization vs per-prompt normalization
  norm_var: true  # Normalize by variance

# =============================================================================
# Rollout Configuration
# =============================================================================
rollout:
  env_path: "./envs/math_env.py"  # Path to environment definition
  bucket_size: 128  # Bucket size in MB for weight sync
  
  # SGLang server arguments
  server_args:
    model_path: "Qwen/Qwen2.5-0.5B-Instruct"
    tp_size: 1
    trust_remote_code: true
    dtype: "bfloat16"
    # Additional SGLang ServerArgs can be added here
  
  # Training rollout settings
  train:
    path: "data/train.jsonl"  # Dataset path
    batch_size: 32  # Batch size for training data
    prompts_per_rollout: 64  # Number of prompts per rollout (null for full dataset)
    partial_rollout: false  # Enable partial rollout (continue pending generations)
    dynamic_filtering: false  # Filter samples with zero reward variance
    max_length: 2048  # Maximum sequence length
  
  # Test/evaluation settings
  test:
    path: null  # Test dataset path (null to split from train)
    prompts_per_rollout: null  # Number of prompts for evaluation (null for full dataset)
    max_length: 2048
  
  test_ratio: 0.1  # Ratio of data to use for testing if test.path is null

# =============================================================================
# Dataset Configuration (for offline training: SFT/DPO/ORPO/SimPO)
# =============================================================================
data:
  train:
    path: "data/train.jsonl"  # Training dataset path
    batch_size: 8  # Batch size
    max_length: 2048  # Maximum sequence length
  
  test:
    path: null  # Test dataset path (null to split from train)
    max_length: 2048
  
  test_ratio: 0.1  # Ratio of data for testing if test.path is null
