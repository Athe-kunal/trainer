defaults:
- _self_
- actor: fsdp
- ref_actor: ${actor}

actor:
  max_inference_length_per_device: ${actor.max_length_per_device}
  temperature: ${rollout.train.sampling_params.temperature}
  update_per_rollout: 1
  clip: 0.2
  tis_coef: 0.0
  avg_level: sequence
  freeze_steps: 0
  offload_model: false

  kl:
    coef: 0.0
    type: loss # `reward` or `loss`
    reward_estimator: k1
    loss_estimator: k3
    # `k1`, `k2` or `k3`. See http://joschu.net/blog/kl-approx.html.

  entropy:
    coef: 0.0

rollout:
  topology: colocate # `colocate` (IPC) or `disaggregated` (NCCL)
  backend: ipc
  vllm:
    host: http://localhost:8000
    server:
      dev_mode: true
      allow_insecure_serialization: true
      enforce_eager: true
      load_format: dummy
      gpu_memory_utilization: 0.5
  server_args:
    model_path: ${actor.model_name}
    dtype: ${actor.dtype}
    tp_size: 1
    mem_fraction_static: 0.6
  train:
    path: null
    prompt_key: prompt
    messages_key: messages
    apply_chat_template: true
    train_on_what: []
    prompts_per_rollout: null
    responses_per_prompt: 1
    sampling_params:
      temperature: 1.0
      max_new_tokens: null
      stop: null
    dynamic_filtering: true
    partial_rollout: false
    save_dir: ${trainer.save_dir}/train
  test:
    path: null
    prompt_key: ${rollout.train.prompt_key}
    messages_key: ${rollout.train.messages_key}
    apply_chat_template: ${rollout.train.apply_chat_template}
    train_on_what: ${rollout.train.train_on_what}
    prompts_per_rollout: null
    responses_per_prompt: 1
    sampling_params:
      temperature: 0.0
      max_new_tokens: ${rollout.train.sampling_params.max_new_tokens}
      stop: ${rollout.train.sampling_params.stop}
    save_dir: ${trainer.save_dir}/test
  test_ratio: 0.03
  env_path: null
  bucket_size: 512

ref_actor:
  temperature: ${rollout.train.sampling_params.temperature}

adv:
  estimator: reinforce # `reinforce` or `gae`
  gamma: 1.0
  lamda: 1.0
  responses_per_prompt: ${rollout.train.responses_per_prompt}
  global_norm: false
  norm_var: true
  
trainer:
  project: null
  experiment_name: null
  load_ckpt_from: null
  total_steps: null
  eval_only: false
  test_freq: null
  save_dir: ckpts/${trainer.experiment_name}
  save_freq: null
  use_wandb: false
